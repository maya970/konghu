[package]
name = "qing"
version = "0.1.0"
edition = "2021"
description = "清机：用户自己打开的签名窗口。没有网络。"
publish = false

[dependencies]
dropio = { path = "../../crates/dropio" }
qing-core = { path = "../../crates/qing-core" }
tablet = { path = "../../crates/tablet" }
zeroize = { version = "1", features = ["derive"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
